name: Bug report
description: Something in the app doesn't work as expected
labels: ["bug fix"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Android app, Web app]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown at the bottom of Settings.
  - type: input
    id: device
    attributes:
      label: Device and OS version
      placeholder: Pixel 8, Android 15
