name: Web

# Builds the Flutter web app and, on main, publishes it to GitHub Pages at
# https://danieldacool.github.io/nutrition-app/. Separate from ci.yml, which
# keeps doing codegen check, analyze, test and the Android APK.
#
# A fork can publish its own copy at https://<owner>.github.io/<repo>/ by
# enabling Pages (source: GitHub Actions) and setting the repository variable
# DEPLOY_PAGES to "true".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: web-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      # Pages serves the site from /<repository name>/, not the domain root.
      # The USDA key ends up readable in the public JS bundle. Accepted: it's
      # a free api.data.gov key whose worst case is someone using up its
      # hourly quota, and DEMO_KEY (30 requests/hour per IP) is too little
      # for friends using the web app. Rotate the secret if it's abused.
      # Fork PRs and forks without the secret fall back to DEMO_KEY.
      - name: Build web
        env:
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: >-
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define=USDA_API_KEY="${USDA_API_KEY:-DEMO_KEY}"

      - name: Copy user manual into the Pages build
        run: cp -r docs/manual build/web/manual

      - name: Upload Pages artifact (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  # Pull requests (including from forks) stop after the build above. Only
  # main deploys, in this repository or in a fork that opted in.
  deploy:
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      (github.repository == 'DanielDaCool/nutrition-app' ||
      vars.DEPLOY_PAGES == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
