name: Tesseract probe (temporary)
on:
  push:
    paths:
      - '.github/workflows/tess-probe.yml'
      - 'tool_probe/**'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-heb tesseract-ocr-eng
      - run: python3 tool_probe/fetch_labels.py
      - run: python3 tool_probe/tess_run.py
