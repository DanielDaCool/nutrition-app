<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Food log, weigh-ins and adaptive calorie targets.">
  <meta name="theme-color" content="#101118">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Nutrition">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Nutrition</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    iOS Safari plays a <video> without `playsinline` in its full-screen
    player, which leaves the barcode scanner's camera preview black.
    mobile_scanner 7.4.2 doesn't set it (juliansteenbakker/mobile_scanner
    issue 1785), so set it, and `muted`, just before any video plays. The
    scanner's preview is the only video in the app.
  -->
  <script>
    (function () {
      var play = HTMLMediaElement.prototype.play;
      HTMLMediaElement.prototype.play = function () {
        if (this instanceof HTMLVideoElement) {
          this.setAttribute('playsinline', '');
          this.playsInline = true;
          this.muted = true;
        }
        return play.apply(this, arguments);
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
